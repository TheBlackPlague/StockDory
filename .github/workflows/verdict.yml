name: Verdict

on:
  push:
  pull_request:

jobs:
  compatibility:
    name: LLVM ${{ matrix.llvm }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        llvm: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.llvm }}

      - name: Select Verdict compiler
        run: |
          mkdir -p "$RUNNER_TEMP/verdict-toolchain"
          ln -s "$(command -v clang++-${{ matrix.llvm }})" "$RUNNER_TEMP/verdict-toolchain/clang++"
          ln -s "$(command -v llvm-profdata-${{ matrix.llvm }})" "$RUNNER_TEMP/verdict-toolchain/llvm-profdata-${{ matrix.llvm }}"
          echo "$RUNNER_TEMP/verdict-toolchain" >> "$GITHUB_PATH"

      - name: Verify LLVM tool resolution
        run: |
          resolved="$(make -s --no-print-directory CXX=clang++ --eval='print-profdata:;@echo $(LLVM_PROFDATA)' print-profdata)"
          test "$resolved" = "$RUNNER_TEMP/verdict-toolchain/llvm-profdata-${{ matrix.llvm }}"

      - name: Prepare network
        run: |
          network="$(find src/Engine/Model -maxdepth 1 -type f -name '*.nnue' -print -quit)"
          test -n "$network"
          cp "$network" "$RUNNER_TEMP/verdict-network.nnue"
          echo "EVALFILE=$RUNNER_TEMP/verdict-network.nnue" >> "$GITHUB_ENV"

      - name: Build as Verdict
        run: |
          make -j"$(nproc)" \
            EXE=StockDory-verdict \
            CXX=clang++ \
            EVALFILE="$EVALFILE"

      - name: Verify executable
        run: test -x StockDory-verdict
