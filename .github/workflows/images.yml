name: Image Publishing

on:
    push:
        branches: [ master, lichess ]
        paths:
            - "src/**"
            - "CMakeLists.txt"
            - "*.cmake"
            - "Dockerfile"
            - "Dockerfile.dockerignore"
            - "Lichess.Dockerfile"
            - "Lichess.Dockerfile.dockerignore"
            - ".github/workflows/images.yml"
    pull_request:
        branches: [ master, lichess ]
        types: [ opened, synchronize, reopened ]
        paths:
            - "src/**"
            - "CMakeLists.txt"
            - "*.cmake"
            - "Dockerfile"
            - "Dockerfile.dockerignore"
            - "Lichess.Dockerfile"
            - "Lichess.Dockerfile.dockerignore"
            - ".github/workflows/images.yml"
    workflow_dispatch:

permissions:
    contents: read
    packages: write

jobs:
    publish:
        runs-on: ubuntu-latest
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        timeout-minutes: 30

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Image Names & Tag
              id: image_info
              shell: bash
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  PR_BRANCH: ${{ github.head_ref }}
                  PR_SHA: ${{ github.event.pull_request.head.sha }}
                  BRANCH_NAME: ${{ github.ref_name }}
                  COMMIT_SHA: ${{ github.sha }}
              run: |
                  set -euo pipefail

                  if [[ "$EVENT_NAME" == "pull_request" ]]; then
                      branch="$PR_BRANCH"
                      revision="$PR_SHA"
                  else
                      branch="$BRANCH_NAME"
                      revision="$COMMIT_SHA"
                  fi

                  branch="$(printf '%s' "$branch" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//')"
                  branch="${branch:0:111}"

                  if [[ -z "$branch" ]]; then
                      branch="image"
                  fi

                  tag="${branch}-${revision:0:16}"
                  owner="${GITHUB_REPOSITORY_OWNER,,}"

                  printf 'stockdory=ghcr.io/%s/stockdory\n' "$owner" >> "$GITHUB_OUTPUT"
                  printf 'lichess=ghcr.io/%s/stockdory-lichess\n' "$owner" >> "$GITHUB_OUTPUT"
                  printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
                  printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"

            - name: Docker Setup
              uses: docker/setup-buildx-action@v4

            - name: GHCR Login
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build & Push StockDory
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: Dockerfile
                  platforms: linux/amd64
                  push: true
                  tags: ${{ steps.image_info.outputs.stockdory }}:${{ steps.image_info.outputs.tag }}
                  build-args: |
                      BUILD_JOBS=1
                      BUILD_NATIVE=OFF
                  cache-from: type=gha,scope=stockdory
                  cache-to: type=gha,mode=max,scope=stockdory
                  labels: |
                      org.opencontainers.image.title=StockDory
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ steps.image_info.outputs.revision }}
                      org.opencontainers.image.version=${{ steps.image_info.outputs.tag }}

            - name: Build & Push StockDory Lichess
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: Lichess.Dockerfile
                  platforms: linux/amd64
                  push: true
                  build-args: |
                      BOTLI_REF=6916a09825067862009393250be9dbd39f442dc8
                      STOCKDORY_IMAGE=${{ steps.image_info.outputs.stockdory }}:${{ steps.image_info.outputs.tag }}
                  tags: ${{ steps.image_info.outputs.lichess }}:${{ steps.image_info.outputs.tag }}
                  cache-from: type=gha,scope=stockdory-lichess
                  cache-to: type=gha,mode=max,scope=stockdory-lichess
                  labels: |
                      org.opencontainers.image.title=StockDory Lichess Bot
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ steps.image_info.outputs.revision }}
                      org.opencontainers.image.version=${{ steps.image_info.outputs.tag }}
