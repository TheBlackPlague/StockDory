name: Container Images

on:
    workflow_dispatch:
    push:
        branches:
            - master
        paths:
            - "src/**"
            - "CMakeLists.txt"
            - "*.cmake"
            - "Dockerfile"
            - "Dockerfile.dockerignore"
            - "Lichess.Dockerfile"
            - "Lichess.Dockerfile.dockerignore"
            - ".docker/botli-entrypoint.py"
            - ".github/workflows/images.yml"

env:
    REGISTRY: ghcr.io
    STOCKDORY_IMAGE: theblackplague/stockdory
    LICHESS_IMAGE: theblackplague/stockdory-lichess

jobs:
    publish:
        runs-on: ubuntu-24.04

        permissions:
            contents: read
            packages: write

        steps:
            - name: Check out StockDory
              uses: actions/checkout@v6

            - name: Generate image tag
              id: tags
              shell: bash
              run: echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

            - name: Setup GHCR
              uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Publish StockDory
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  platforms: linux/amd64
                  push: true
                  tags: |
                      ${{ env.REGISTRY }}/${{ env.STOCKDORY_IMAGE }}:latest
                      ${{ env.REGISTRY }}/${{ env.STOCKDORY_IMAGE }}:${{ steps.tags.outputs.sha_tag }}
                  labels: |
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                  build-args: |
                      BUILD_JOBS=1
                      BUILD_NATIVE=OFF
                  cache-from: type=gha,scope=stockdory
                  cache-to: type=gha,mode=max,scope=stockdory

            - name: Publish StockDory Lichess
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile.Lichess
                  platforms: linux/amd64
                  push: true
                  tags: |
                      ${{ env.REGISTRY }}/${{ env.LICHESS_IMAGE }}:latest
                      ${{ env.REGISTRY }}/${{ env.LICHESS_IMAGE }}:${{ steps.tags.outputs.sha_tag }}
                  labels: |
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                  build-args: |
                      BOTLI_REF=6916a09825067862009393250be9dbd39f442dc8
                      STOCKDORY_IMAGE=${{ env.REGISTRY }}/${{ env.STOCKDORY_IMAGE }}:${{ steps.vars.outputs.sha_tag }}
                  cache-from: type=gha,scope=stockdory-lichess
                  cache-to: type=gha,mode=max,scope=stockdory-lichess