name: Linux Clang 20

on:
  push:
    branches: [ "0.1-comparison" ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y ninja-build
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 20

      - name: Configure
        env:
          CC: clang-20
          CXX: clang++-20
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCI=ON -DCMAKE_CXX_FLAGS="-march=x86-64-v3" -G Ninja

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}
